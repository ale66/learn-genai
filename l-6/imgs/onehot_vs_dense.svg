<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="white"/>

  <!-- Title labels -->
  <text x="220" y="40" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">One-hot vector for "cat"</text>
  <text x="680" y="40" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">Dense embedding for "cat"</text>

  <!-- One-hot vector: 10 cells, one filled -->
  <g transform="translate(70,80)">
    <!-- vocabulary labels -->
    <text x="-15" y="20" font-size="13" fill="#666666" text-anchor="end">dog</text>
    <text x="-15" y="52" font-size="13" fill="#666666" text-anchor="end">cat</text>
    <text x="-15" y="84" font-size="13" fill="#666666" text-anchor="end">king</text>
    <text x="-15" y="116" font-size="13" fill="#666666" text-anchor="end">queen</text>
    <text x="-15" y="148" font-size="13" fill="#666666" text-anchor="end">apple</text>
    <text x="-15" y="180" font-size="13" fill="#666666" text-anchor="end">...</text>
    <text x="-15" y="212" font-size="13" fill="#666666" text-anchor="end">mango</text>
    <text x="-15" y="244" font-size="13" fill="#666666" text-anchor="end">(50,000 more)</text>

    <rect x="0" y="4" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
    <rect x="0" y="36" width="260" height="28" fill="#B5482B" stroke="#943a22"/>
    <text x="130" y="55" font-size="14" fill="white" text-anchor="middle" font-weight="bold">1</text>
    <rect x="0" y="68" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
    <rect x="0" y="100" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
    <rect x="0" y="132" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
    <rect x="0" y="164" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
    <rect x="0" y="196" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
    <rect x="0" y="228" width="260" height="28" fill="#F0F0F0" stroke="#cccccc"/>
  </g>

  <text x="220" y="360" font-size="14" fill="#555555" text-anchor="middle">A vector as long as the whole vocabulary.</text>
  <text x="220" y="382" font-size="14" fill="#555555" text-anchor="middle">Every word is equally "far" from every other word.</text>

  <!-- Arrow between the two -->
  <path d="M 400 200 L 470 200" stroke="#999999" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Dense embedding: colored bar chart of ~8 values -->
  <g transform="translate(560,90)">
    <!-- axis -->
    <line x1="0" y1="110" x2="240" y2="110" stroke="#cccccc"/>
    <!-- bars representing a real-valued vector -->
    <g font-size="11" fill="#666666" text-anchor="middle">
      <rect x="0"   y="70"  width="24" height="40" fill="#2E7D6B"/>
      <rect x="30"  y="30"  width="24" height="80" fill="#2E7D6B"/>
      <rect x="60"  y="90"  width="24" height="20" fill="#B5482B"/>
      <rect x="90"  y="10"  width="24" height="100" fill="#2E7D6B"/>
      <rect x="120" y="60"  width="24" height="50" fill="#B5482B"/>
      <rect x="150" y="45"  width="24" height="65" fill="#2E7D6B"/>
      <rect x="180" y="85"  width="24" height="25" fill="#B5482B"/>
      <rect x="210" y="20"  width="24" height="90" fill="#2E7D6B"/>
      <text x="12" y="128">0.12</text>
      <text x="42" y="128">0.91</text>
      <text x="72" y="128">-0.34</text>
      <text x="102" y="128">1.20</text>
      <text x="132" y="128">-0.55</text>
      <text x="162" y="128">0.77</text>
      <text x="192" y="128">-0.20</text>
      <text x="222" y="128">1.05</text>
    </g>
  </g>

  <text x="680" y="360" font-size="14" fill="#555555" text-anchor="middle">Just a few hundred numbers, learned from data.</text>
  <text x="680" y="382" font-size="14" fill="#555555" text-anchor="middle">Similar meanings end up with similar numbers.</text>
</svg>
